[package]
name = "timefold"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Klasor/dosya boyut zaman cizelgesi ve isi haritasi analiz araci; hicbir kullanici dosyasini degistirmez."
repository = "https://github.com/SyntaxOrigin/timefold"
readme = "README.md"
keywords = ["cli", "timefold", "disk", "snapshot", "history"]
categories = ["command-line-utilities"]

[dependencies]
# serde: anlik goruntu basligi, JSONL degisim kayitlari, depo indeksi ve rapor semasi icin turetilmis veri yuzleri (src/kayit.rs, src/depo.rs, src/rapor.rs).
serde = { version = "1", features = ["derive"] }
# serde_json: JSONL anlik goruntu/delta yazimi, depo indeksi (index.json) ve --json rapor ciktisi (src/depo.rs, src/rapor.rs, src/kayit.rs).
serde_json = "1"
# clap: scan / diff / timeline / heatmap / undo / redo / restore / forecast / list alt komutlarinin ve bayraklarinin ayristirilmasi (src/main.rs).
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
